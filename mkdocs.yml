site_name: Performance Comercial
site_description: Documentação técnica do modelo semântico Power BI — Performance Comercial
site_author: Equipe de BI
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: pt
  # Menu por pasta: cada pasta pode ter um .nav.yml. Não use `nav:` neste arquivo.
  - awesome-nav
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: pt
      fallback_to_build_date: true
  - panzoom:
      mermaid: true
      full_screen: true
      always_show_hint: true

# Com `mkdocs build --strict`, estes avisos quebram o build:
# página fora do menu e link para página que não existe.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
