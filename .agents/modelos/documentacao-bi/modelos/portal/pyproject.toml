[project]
name = "portal-documentacao-bi"
version = "0.1.0"
description = "Portal de documentação dos projetos de BI (MkDocs Material)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # MkDocs 2.0 remove o sistema de plugins: manter na série 1.x.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-awesome-nav>=3.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-panzoom-plugin>=0.5.2",
]
